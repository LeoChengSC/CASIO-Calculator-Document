  <path d="M64.0,46.4 L380.0,237.3 L696.0,46.4" fill="none" stroke="var(--accent)" stroke-width="2.4"/>
  <line x1="90.3" y1="237.27272727272728" x2="90.3" y2="62.3" stroke="var(--accent-soft)" stroke-width="1.2" stroke-dasharray="4 3"/>
