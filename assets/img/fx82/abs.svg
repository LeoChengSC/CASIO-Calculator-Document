<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="fx82-abs-title fx82-abs-desc">
  <title id="fx82-abs-title">Absolute value y = |x| with Abs(−5.5) = 5.5</title>
  <desc id="fx82-abs-desc">The V-shaped graph of y = |x|. The example Abs(−5.5) maps to the point (5.5, 5.5) on the right arm.</desc>
  
