<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="prgm-example-card-title prgm-example-card-desc">
  <title id="prgm-example-card-title">Horizontal line (1, 5) and (4, 5)</title>
  <desc id="prgm-example-card-desc">Case sketch for this worked example.</desc>
  
  <rect x="28" y="34" width="664" height="254" rx="14" fill="var(--accent)" fill-opacity="0.06" stroke="var(--accent)" stroke-width="1.2"/>
  <text x="46" y="80" fill="var(--accent)" font-size="24">Horizontal line (1, 5) and (4, 5)</text>
  <text x="46" y="118" fill="var(--text)" font-size="20">Slope 0, intercept 5, distance 3.</text>
  <text x="46" y="148" fill="var(--text)" font-size="20">1 【EXE】  5 【EXE】  4 【EXE】  5 【EXE】</text>
  <text x="46" y="178" fill="var(--text)" font-size="20">3, then 0, then 5. Equation y = 5</text>

</svg>
