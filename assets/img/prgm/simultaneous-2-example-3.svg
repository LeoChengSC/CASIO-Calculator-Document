<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="prgm-sim2-ex3-title prgm-sim2-ex3-desc">
  <title id="prgm-sim2-ex3-title">Parallel case: x+y=1 and 2x+2y=5</title>
  <desc id="prgm-sim2-ex3-desc">Edge case where determinant is zero and there is no unique (x,y).</desc>
  
  <line x1="64" y1="245.14285714285714" x2="680" y2="245.14285714285714" stroke="var(--text-muted)" stroke-width="1.2"/>
  <line x1="152" y1="280" x2="152" y2="36" stroke="var(--text-muted)" stroke-width="1.2"/>
  <line x1="64" y1="175.42857142857144" x2="680" y2="419.42857142857144" stroke="var(--accent)" stroke-width="2.2"/>
  <line x1="64" y1="36" x2="680" y2="280" stroke="var(--accent)" stroke-width="2.2"/>
  <text x="574.4" y="248.62857142857143" fill="var(--text)">x + y = 1</text>
  <text x="521.6" y="112.68571428571428" fill="var(--text)">2x + 2y = 5</text>
  <text x="187.2" y="56.91428571428568" fill="var(--accent)">No unique (?, ?)</text>

</svg>
