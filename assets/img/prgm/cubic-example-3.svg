<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="prgm-example-card-title prgm-example-card-desc">
  <title id="prgm-example-card-title">x³ + x = 0 → 0, ±i</title>
  <desc id="prgm-example-card-desc">Case sketch for this worked example.</desc>
  
  <rect x="28" y="34" width="664" height="254" rx="14" fill="var(--accent)" fill-opacity="0.06" stroke="var(--accent)" stroke-width="1.2"/>
  <text x="46" y="80" fill="var(--accent)" font-size="24">x³ + x = 0 → 0, ±i</text>
  <text x="46" y="118" fill="var(--text)" font-size="20">A,B,C,D = 1, 0, 1, 0. Guess 0. The quadratic is x² + 1. Run the slot in CMPLX to print ±i.</text>
  <text x="46" y="148" fill="var(--text)" font-size="20">CMPLX slot. 1 【EXE】  0 【EXE】  1 【EXE】  0 【EXE】  0 【EXE】</text>
  <text x="46" y="178" fill="var(--text)" font-size="20">First root 0. Next pauses: i and −i (R&lt;=&gt;I). In COMP you get Math ERROR on √(−1)</text>

</svg>
