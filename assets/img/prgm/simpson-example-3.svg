<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="prgm-example-card-title prgm-example-card-desc">
  <title id="prgm-example-card-title">Change f — here ∫₀¹ e^X dX</title>
  <desc id="prgm-example-card-desc">Case sketch for this worked example.</desc>
  
  <rect x="28" y="34" width="664" height="254" rx="14" fill="var(--accent)" fill-opacity="0.06" stroke="var(--accent)" stroke-width="1.2"/>
  <text x="46" y="80" fill="var(--accent)" font-size="24">Change f — here ∫₀¹ e^X dX</text>
  <text x="46" y="118" fill="var(--text)" font-size="20">Replace ln(X) with e^(X. Lower 0, upper 1, n = 10. Exact e − 1 ≈ 1.718281828.</text>
  <text x="46" y="148" fill="var(--text)" font-size="20">Edit only the green integrand. Variable stays X</text>
  <text x="46" y="178" fill="var(--text)" font-size="20">0 【EXE】  1 【EXE】  10 【EXE】</text>

</svg>
