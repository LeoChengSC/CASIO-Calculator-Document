<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="prgm-example-card-title prgm-example-card-desc">
  <title id="prgm-example-card-title">Guess near a different root</title>
  <desc id="prgm-example-card-desc">Case sketch for this worked example.</desc>
  
  <rect x="28" y="34" width="664" height="254" rx="14" fill="var(--accent)" fill-opacity="0.06" stroke="var(--accent)" stroke-width="1.2"/>
  <text x="46" y="80" fill="var(--accent)" font-size="24">Guess near a different root</text>
  <text x="46" y="118" fill="var(--text)" font-size="20">Same polynomial, guess M = 5 walks to 3 first.</text>
  <text x="46" y="148" fill="var(--text)" font-size="20">1 【EXE】  −6 【EXE】  11 【EXE】  −6 【EXE】  5 【EXE】</text>
  <text x="46" y="178" fill="var(--text)" font-size="20">Pauses 3, then 1 and 2 (order of the last two follows the quadratic formula)</text>

</svg>
