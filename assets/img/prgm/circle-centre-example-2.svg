<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="prgm-example-card-title prgm-example-card-desc">
  <title id="prgm-example-card-title">2x² + 2y² − 8x + 0y − 8 = 0</title>
  <desc id="prgm-example-card-desc">Case sketch for this worked example.</desc>
  
  <rect x="28" y="34" width="664" height="254" rx="14" fill="var(--accent)" fill-opacity="0.06" stroke="var(--accent)" stroke-width="1.2"/>
  <text x="46" y="80" fill="var(--accent)" font-size="24">2x² + 2y² − 8x + 0y − 8 = 0</text>
  <text x="46" y="118" fill="var(--text)" font-size="20">Same circle as (x−2)² + y² = 6, scaled by 2.</text>
  <text x="46" y="148" fill="var(--text)" font-size="20">2 【EXE】  −8 【EXE】  0 【EXE】  −8 【EXE】</text>
  <text x="46" y="178" fill="var(--text)" font-size="20">Centre (2, 0). Radius √6 ≈ 2.449</text>

</svg>
