  <line x1="410.0" y1="138" x2="410.0" y2="144" stroke="var(--text-muted)" stroke-width="1"/>
  <text x="410.0" y="158" text-anchor="middle" fill="var(--text)">4</text>
  <line x1="450.0" y1="138" x2="450.0" y2="144" stroke="var(--text-muted)" stroke-width="1"/>
  <text x="450.0" y="158" text-anchor="middle" fill="var(--text)">5</text>
  <line x1="250" y1="298.0" x2="244" y2="298.0" stroke="var(--text-muted)" stroke-width="1"/>
  <text x="238" y="298.04" text-anchor="end" fill="var(--text)">-4</text>
  <line x1="250" y1="258.0" x2="244" y2="258.0" stroke="var(--text-muted)" stroke-width="1"/>
  <text x="238" y="258.04" text-anchor="end" fill="var(--text)">-3</text>
  <line x1="250" y1="218.0" x2="244" y2="218.0" stroke="var(--text-muted)" stroke-width="1"/>
  <text x="238" y="218.04" text-anchor="end" fill="var(--text)">-2</text>
  <line x1="250" y1="178.0" x2="244" y2="178.0" stroke="var(--text-muted)" stroke-width="1"/>
  <text x="238" y="178.04" text-anchor="end" fill="var(--text)">-1</text>
  <line x1="250" y1="98.0" x2="244" y2="98.0" stroke="var(--text-muted)" stroke-width="1"/>
  <text x="238" y="98.04" text-anchor="end" fill="var(--text)">1</text>
  <line x1="250" y1="58.0" x2="244" y2="58.0" stroke="var(--text-muted)" stroke-width="1"/>
  <text x="238" y="58.04" text-anchor="end" fill="var(--text)">2</text>
  <line x1="370.0" y1="58.0" x2="410.0" y2="218.0" stroke="var(--accent-soft)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="290.0" y1="298.0" x2="410.0" y2="218.0" stroke="var(--accent-soft)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="250" y1="138" x2="370.0" y2="58.0" stroke="var(--accent-soft)" stroke-width="2"/>
  <polygon points="370.0,58.0 366.8,65.3 362.0,58.2" fill="var(--accent)"/>
  <line x1="250" y1="138" x2="290.0" y2="298.0" stroke="var(--accent-soft)" stroke-width="2"/>
  <polygon points="290.0,298.0 284.2,292.5 292.5,290.4" fill="var(--accent)"/>
  <line x1="250" y1="138" x2="410.0" y2="218.0" stroke="var(--accent)" stroke-width="2.6"/>
  <polygon points="410.0,218.0 400.1,219.0 404.8,209.4" fill="var(--accent)"/>
  <circle cx="410.0" cy="218.0" r="5" fill="var(--accent)" stroke="var(--bg)" stroke-width="1.6"/>
  <text x="380" y="50" fill="var(--text)">3 + 2i</text>
