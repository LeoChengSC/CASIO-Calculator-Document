<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="cmplx-add-title cmplx-add-desc">
  <title id="cmplx-add-title">Adding 3+2i and 1−4i on the complex plane</title>
  <desc id="cmplx-add-desc">Two complex numbers drawn as arrows from the origin. Their parallelogram sum is the resultant 4−2i.</desc>
  
  <line x1="194.0" y1="138" x2="482.0" y2="138" stroke="var(--text-muted)" stroke-width="1.2"/>
  <line x1="250" y1="314.0" x2="250" y2="38.0" stroke="var(--text-muted)" stroke-width="1.2"/>
  <line x1="210.0" y1="138" x2="210.0" y2="144" stroke="var(--text-muted)" stroke-width="1"/>
  <text x="210.0" y="158" text-anchor="middle" fill="var(--text)">-1</text>
  <line x1="290.0" y1="138" x2="290.0" y2="144" stroke="var(--text-muted)" stroke-width="1"/>
  <text x="290.0" y="158" text-anchor="middle" fill="var(--text)">1</text>
  <line x1="330.0" y1="138" x2="330.0" y2="144" stroke="var(--text-muted)" stroke-width="1"/>
  <text x="330.0" y="158" text-anchor="middle" fill="var(--text)">2</text>
  <line x1="370.0" y1="138" x2="370.0" y2="144" stroke="var(--text-muted)" stroke-width="1"/>
