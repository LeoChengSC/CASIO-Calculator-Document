<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="sd-freq-title sd-freq-desc">
  <title id="sd-freq-title">Frequency bars for scores 75, 80, 85</title>
  <desc id="sd-freq-desc">Three classes: 75 appears once, 80 twice, 85 four times. The mean is pulled toward 85 because that class has the largest frequency.</desc>
  
  <line x1="120" y1="250" x2="640" y2="250" stroke="var(--text-muted)" stroke-width="1.2"/>
  <line x1="120" y1="64" x2="120" y2="250" stroke="var(--text-muted)" stroke-width="1.2"/>
  <rect x="160" y="203.5" width="72" height="46.5" fill="var(--accent)" fill-opacity="0.78"/>
  <text x="196" y="195.5" text-anchor="middle" fill="var(--text)">f = 1</text>
  <text x="196" y="272" text-anchor="middle" fill="var(--text)">75</text>
  <rect x="310" y="157.0" width="72" height="93.0" fill="var(--accent)" fill-opacity="0.78"/>
  <text x="346" y="149" text-anchor="middle" fill="var(--text)">f = 2</text>
  <text x="346" y="272" text-anchor="middle" fill="var(--text)">80</text>
  <rect x="460" y="64.0" width="72" height="186.0" fill="var(--accent)" fill-opacity="0.78"/>
  <text x="496" y="56" text-anchor="middle" fill="var(--text)">f = 4</text>
  <text x="496" y="272" text-anchor="middle" fill="var(--text)">85</text>
  <line x1="120" y1="64" x2="640" y2="64" stroke="var(--text-muted)" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.5"/>
  <text x="110" y="254" text-anchor="end" fill="var(--text)">0</text>
  <text x="110" y="68" text-anchor="end" fill="var(--text)">4</text>
  <text x="360" y="28" text-anchor="middle" fill="var(--text)">FreqOn: 75 once, 80 twice, 85 four times</text>
  <text x="360" y="302" text-anchor="middle" fill="var(--accent-soft)">n = 7; mean pulled toward the tallest bar (85)</text>

</svg>
