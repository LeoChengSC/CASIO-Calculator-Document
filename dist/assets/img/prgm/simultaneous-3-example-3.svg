<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="prgm-example-card-title prgm-example-card-desc">
  <title id="prgm-example-card-title">Inverse via adjoint</title>
  <desc id="prgm-example-card-desc">Case sketch for this worked example.</desc>
  
  <rect x="28" y="34" width="664" height="254" rx="14" fill="var(--accent)" fill-opacity="0.06" stroke="var(--accent)" stroke-width="1.2"/>
  <text x="46" y="80" fill="var(--accent)" font-size="24">Inverse via adjoint</text>
  <text x="46" y="118" fill="var(--text)" font-size="20">[[2,1,3],[7,4,6],[8,9,7]], det = 40. Use the 112-byte listing.</text>
  <text x="46" y="148" fill="var(--text)" font-size="20">2 【EXE】  1 【EXE】  3 【EXE】  7 【EXE】  4 【EXE】  6 【EXE】  8 【EXE】  9 【EXE】  7 【EXE】</text>
  <text x="46" y="178" fill="var(--text)" font-size="20">Adjoint row-major: −26, 20, −6, −1, −10, 9, 31, −10, 1, then det 40</text>

</svg>
