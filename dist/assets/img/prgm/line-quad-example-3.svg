<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="prgm-example-card-title prgm-example-card-desc">
  <title id="prgm-example-card-title">Falls back to 2×2 linear</title>
  <desc id="prgm-example-card-desc">Case sketch for this worked example.</desc>
  
  <rect x="28" y="34" width="664" height="254" rx="14" fill="var(--accent)" fill-opacity="0.06" stroke="var(--accent)" stroke-width="1.2"/>
  <text x="46" y="80" fill="var(--accent)" font-size="24">Falls back to 2×2 linear</text>
  <text x="46" y="118" fill="var(--text)" font-size="20">x + y = 7 and x − y = 1. Quadratic coefficients all 0.</text>
  <text x="46" y="148" fill="var(--text)" font-size="20">1 【EXE】  1 【EXE】  7 【EXE】  0 【EXE】  0 【EXE】  0 【EXE】  1 【EXE】  −1 【EXE】  1 【EXE】</text>
  <text x="46" y="178" fill="var(--text)" font-size="20">Display x = 4. 【EXE】 → y = 3. Equal pair ⇒ a ‘tangent’ with only one point</text>

</svg>
