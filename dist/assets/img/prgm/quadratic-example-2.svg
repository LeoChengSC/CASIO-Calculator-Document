<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="prgm-example-card-title prgm-example-card-desc">
  <title id="prgm-example-card-title">x² + 6x + 25 = 0 (complex)</title>
  <desc id="prgm-example-card-desc">Case sketch for this worked example.</desc>
  
  <rect x="28" y="34" width="664" height="254" rx="14" fill="var(--accent)" fill-opacity="0.06" stroke="var(--accent)" stroke-width="1.2"/>
  <text x="46" y="80" fill="var(--accent)" font-size="24">x² + 6x + 25 = 0 (complex)</text>
  <text x="46" y="118" fill="var(--text)" font-size="20">Create the slot in CMPLX. Discriminant 36 − 100 = −64.</text>
  <text x="46" y="148" fill="var(--text)" font-size="20">MODE → 6 → 1 → unused slot → 2 (CMPLX), paste the line, then Run</text>
  <text x="46" y="178" fill="var(--text)" font-size="20">1 【EXE】  6 【EXE】  25 【EXE】</text>

</svg>
