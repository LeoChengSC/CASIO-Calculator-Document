<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="prgm-example-card-title prgm-example-card-desc">
  <title id="prgm-example-card-title">p outside (0, 0.5)</title>
  <desc id="prgm-example-card-desc">Case sketch for this worked example.</desc>
  
  <rect x="28" y="34" width="664" height="254" rx="14" fill="var(--accent)" fill-opacity="0.06" stroke="var(--accent)" stroke-width="1.2"/>
  <text x="46" y="80" fill="var(--accent)" font-size="24">p outside (0, 0.5)</text>
  <text x="46" y="118" fill="var(--text)" font-size="20">Left tail, two-tail, or p ≥ 0.5 must be rewritten first.</text>
  <text x="46" y="148" fill="var(--text)" font-size="20">P(Z ≤ a) = 0.9 → central slab is 0.4, then run 0.4; the printed x is a</text>
  <text x="46" y="178" fill="var(--text)" font-size="20">P(Z ≥ a) = 0.1 is the same 0.4 slab</text>

</svg>
