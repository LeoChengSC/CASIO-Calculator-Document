<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="prgm-example-card-title prgm-example-card-desc">
  <title id="prgm-example-card-title">x³ − 6x² + 11x − 6 = 0</title>
  <desc id="prgm-example-card-desc">Case sketch for this worked example.</desc>
  
  <rect x="28" y="34" width="664" height="254" rx="14" fill="var(--accent)" fill-opacity="0.06" stroke="var(--accent)" stroke-width="1.2"/>
  <text x="46" y="80" fill="var(--accent)" font-size="24">x³ − 6x² + 11x − 6 = 0</text>
  <text x="46" y="118" fill="var(--text)" font-size="20">A,B,C,D = 1, −6, 11, −6. Guess M = 0.</text>
  <text x="46" y="148" fill="var(--text)" font-size="20">1 【EXE】  −6 【EXE】  11 【EXE】  −6 【EXE】  0 【EXE】</text>
  <text x="46" y="178" fill="var(--text)" font-size="20">First pause: 1 (Newton root). 【EXE】 → 2. 【EXE】 → 3</text>

</svg>
