<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="prgm-example-card-title prgm-example-card-desc">
  <title id="prgm-example-card-title">X ~ Po(5), P(X = 4) and P(4 ≤ X ≤ 6)</title>
  <desc id="prgm-example-card-desc">Case sketch for this worked example.</desc>
  
  <rect x="28" y="34" width="664" height="254" rx="14" fill="var(--accent)" fill-opacity="0.06" stroke="var(--accent)" stroke-width="1.2"/>
  <text x="46" y="80" fill="var(--accent)" font-size="24">X ~ Po(5), P(X = 4) and P(4 ≤ X ≤ 6)</text>
  <text x="46" y="118" fill="var(--text)" font-size="20">Second input 4 is not a probability, so A is λ.</text>
  <text x="46" y="148" fill="var(--text)" font-size="20">5 【EXE】  4 【EXE】 → P(X=4) ≈ 0.17547, then AC</text>
  <text x="46" y="178" fill="var(--text)" font-size="20">5 【EXE】  4 【EXE】  6 【EXE】 → P(4≤X≤6) ≈ 0.49716</text>

</svg>
