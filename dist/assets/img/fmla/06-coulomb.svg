<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="fmla06-title fmla06-desc">
  <title id="fmla06-title">Two positive point charges pushing apart</title>
  <desc id="fmla06-desc">Coulomb's law: like charges repel. The force on each charge is equal in size and opposite in direction, and it gets smaller as r grows.</desc>
  
  <circle cx="220" cy="170" r="28" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)" stroke-width="2"/>
  <circle cx="500" cy="170" r="28" fill="var(--accent)" fill-opacity="0.15" stroke="var(--accent)" stroke-width="2"/>
  <text x="220" y="176" text-anchor="middle" fill="var(--text)">q₁</text>
  <text x="500" y="176" text-anchor="middle" fill="var(--text)">q₂</text>
  <line x1="260" y1="170" x2="460" y2="170" stroke="var(--text-muted)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="360" y="156" text-anchor="middle">r</text>
  <path d="M160 170 L120 170" stroke="var(--accent-soft)" stroke-width="2.2" marker-end="url(#arr)"/>
  <path d="M560 170 L600 170" stroke="var(--accent-soft)" stroke-width="2.2"/>
  <polygon points="600,164 616,170 600,176" fill="var(--accent-soft)"/>
  <polygon points="120,164 104,170 120,176" fill="var(--accent-soft)"/>
  <text x="110" y="150" fill="var(--accent-soft)">F</text>
  <text x="610" y="150" fill="var(--accent-soft)">F</text>
  <text x="360" y="250" text-anchor="middle">Like charges push apart. Bigger r → smaller F.</text>
  <defs></defs>

</svg>
